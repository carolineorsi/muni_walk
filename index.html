<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Muni Walker — Follow the Line</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#12151A;
    --panel:#1C222B;
    --panel-2:#232A34;
    --line-hair:#333c48;
    --paper:#EDEAE1;
    --muted:#8C96A6;
    --amber:#F2A73B;
    --amber-dim:#8a6323;
    --inbound:#4F86F7;
    --outbound:#EF5B4E;
    --good:#4FD1A5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--charcoal);font-family:'Inter',sans-serif;color:var(--paper);overflow:hidden;}

  #app{position:relative;height:100vh;width:100vw;}
  #map{position:absolute;inset:0;}
  .leaflet-container{background:#0d1014;}

  /* ---------- Headsign top bar ---------- */
  #headsign{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    background:#0b0d10;
    border-bottom:3px solid var(--amber-dim);
    padding:10px 14px 12px;
    display:flex;align-items:center;gap:12px;
    box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  .badge{
    flex:0 0 auto;
    min-width:52px;height:44px;
    display:flex;align-items:center;justify-content:center;
    background:var(--amber);color:#1a1204;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;font-size:22px;letter-spacing:.5px;
    border-radius:6px;
    padding:0 8px;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);
  }
  .badge.empty{background:#2a3038;color:var(--muted);font-size:14px;font-weight:600;}
  #picker-wrap{flex:1 1 auto;min-width:0;position:relative;}
  #route-label{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
    margin:0 0 2px 2px;
  }
  select#route-select{
    -webkit-appearance:none;appearance:none;
    width:100%;
    background:#161a1f;
    color:var(--paper);
    border:1px solid #333c48;
    border-radius:6px;
    padding:9px 34px 9px 12px;
    font-family:'Barlow Condensed',sans-serif;
    font-size:19px;font-weight:600;letter-spacing:.3px;
    background-image:linear-gradient(45deg, transparent 50%, var(--amber) 50%), linear-gradient(135deg, var(--amber) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%;
    background-size:6px 6px, 6px 6px;
    background-repeat:no-repeat;
  }
  select#route-select:focus{outline:2px solid var(--amber);outline-offset:1px;}

  #status-pill{
    flex:0 0 auto;
    font-family:'Space Mono',monospace;
    font-size:11px;color:var(--muted);
    display:flex;align-items:center;gap:6px;
    padding:0 4px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#555;flex:0 0 auto;}
  .dot.live{background:var(--good);box-shadow:0 0 6px var(--good);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- Bottom info card ---------- */
  #info-card{
    position:absolute;left:14px;right:14px;bottom:14px;z-index:1000;
    background:var(--panel);
    border:1px solid var(--line-hair);
    border-radius:12px;
    padding:14px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    display:none;
  }
  #info-card.visible{display:block;}
  .info-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .info-title{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.3px;
    flex:0 0 auto;white-space:nowrap;
  }
  #info-summary{
    font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);
    display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:1 1 auto;min-width:0;text-align:right;margin-right:4px;
  }
  #info-card.collapsed #info-summary{display:inline-block;}
  #collapse-btn{
    flex:0 0 auto;width:28px;height:28px;border-radius:50%;
    background:var(--panel-2);border:1px solid var(--line-hair);color:var(--paper);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    padding:0;transition:background .15s;
  }
  #collapse-btn:active{background:var(--line-hair);}
  #collapse-btn svg{width:14px;height:14px;transition:transform .2s ease;}
  #info-card.collapsed #collapse-btn svg{transform:rotate(180deg);}
  #info-card-body{
    max-height:400px;opacity:1;overflow:hidden;
    transition:max-height .25s ease, opacity .2s ease, margin .25s ease;
  }
  #info-card.collapsed #info-card-body{max-height:0;opacity:0;}
  .legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-family:'Inter';}
  .legend-swatch{width:16px;height:3px;border-radius:2px;}

  /* ---------- Direction toggle ---------- */
  #direction-toggle{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .dir-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--panel-2);border:1px solid var(--line-hair);
    color:var(--muted);
    font-family:'Inter';font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:20px;
    cursor:pointer;transition:all .15s;
  }
  .dir-btn:disabled{opacity:.35;cursor:not-allowed;}
  .dir-btn .dot-swatch{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .dir-btn.inbound .dot-swatch{background:var(--inbound);}
  .dir-btn.outbound .dot-swatch{background:var(--outbound);}
  .dir-btn.active{color:var(--paper);border-color:currentColor;}
  .dir-btn.inbound.active{background:rgba(79,134,247,.18);border-color:var(--inbound);}
  .dir-btn.outbound.active{background:rgba(239,91,78,.18);border-color:var(--outbound);}

  /* ---------- Progress-along-route ---------- */
  #progress-block{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-hair);display:none;}
  #progress-block.visible{display:block;}
  .progress-heading{display:flex;justify-content:space-between;align-items:baseline;}
  .progress-figures{display:flex;align-items:baseline;gap:8px;}
  #progress-miles{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:30px;color:var(--paper);line-height:1;}
  #progress-miles-unit{font-size:12px;color:var(--muted);}
  #progress-pct{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;color:var(--amber);}
  .progress-track{margin-top:8px;height:8px;border-radius:5px;background:#0e1116;border:1px solid var(--line-hair);overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg, var(--amber-dim), var(--amber));transition:width .3s ease;}

  .stat{
    font-family:'Space Mono',monospace;
    font-size:13px;color:var(--paper);
  }
  .stat-label{color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-family:'Inter';display:block;margin-bottom:2px;}
  #distance-block{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-hair);display:flex;justify-content:space-between;align-items:center;gap:12px;}
  #distance-value{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;color:var(--amber);line-height:1;}
  #distance-sub{font-size:11px;color:var(--muted);margin-top:2px;}

  /* ---------- floating controls ---------- */
  #locate-btn{
    position:absolute;right:14px;z-index:1000;
    width:48px;height:48px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line-hair);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    cursor:pointer;
    color:var(--paper);
    transition:background .15s, border-color .15s, transform .1s;
  }
  #locate-btn:active{transform:scale(.94);}
  #locate-btn.following{background:var(--amber);border-color:var(--amber);color:#1a1204;}
  #locate-btn svg{width:22px;height:22px;}

  /* ---------- empty state ---------- */
  #empty-hint{
    position:absolute;top:96px;left:14px;right:14px;z-index:900;
    font-family:'Inter';font-size:13px;color:var(--muted);
    background:rgba(28,34,43,.85);backdrop-filter:blur(4px);
    border:1px dashed var(--line-hair);border-radius:10px;
    padding:12px 14px;
    display:block;
  }
  #empty-hint.hidden{display:none;}

  #error-toast{
    position:absolute;top:96px;left:14px;right:14px;z-index:1100;
    background:#3a1414;border:1px solid #7a2b2b;color:#f4c9c9;
    font-size:12.5px;padding:10px 12px;border-radius:8px;display:none;
  }
  #error-toast.visible{display:block;}

  /* markers */
  .me-dot{width:16px;height:16px;border-radius:50%;background:var(--good);border:3px solid #0b0d10;box-shadow:0 0 0 4px rgba(79,209,165,.25);}
  .end-marker{
    background:#0b0d10;color:var(--paper);font-family:'Space Mono',monospace;font-size:10px;
    padding:2px 6px;border-radius:4px;border:1px solid var(--line-hair);white-space:nowrap;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#333c48;border-radius:4px;}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="headsign">
    <div id="badge" class="badge empty">SF</div>
    <div id="picker-wrap">
      <p id="route-label">Choose a Muni line</p>
      <select id="route-select">
        <option value="">Loading routes…</option>
      </select>
    </div>
    <div id="status-pill"><span class="dot" id="gps-dot"></span><span id="gps-text">GPS off</span></div>
  </div>

  <div id="empty-hint">Pick a line above to draw its route. Tap the compass to track your position and follow it on foot.</div>
  <div id="error-toast"></div>

  <button id="locate-btn" title="Follow my location" aria-label="Follow my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
    </svg>
  </button>

  <div id="info-card">
    <div class="info-row">
      <div class="info-title" id="info-title">—</div>
      <span id="info-summary"></span>
      <button id="collapse-btn" title="Collapse panel" aria-label="Collapse panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"></path>
        </svg>
      </button>
    </div>

    <div id="info-card-body">
    <div id="direction-toggle"></div>

    <div id="progress-block">
      <div class="progress-heading">
        <span class="stat-label">Progress along route</span>
        <span id="progress-pct">—</span>
      </div>
      <div class="progress-figures">
        <span id="progress-miles">—</span><span id="progress-miles-unit">mi walked of route</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div id="distance-block">
      <div>
        <span class="stat-label">Distance to route</span>
        <div id="distance-value">—</div>
        <div id="distance-sub">turn on GPS to measure</div>
      </div>
      <div style="text-align:right">
        <span class="stat-label">Nearest point</span>
        <div class="stat" id="nearest-coord">—</div>
      </div>
    </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  const EMBEDDED_ROUTE_NAMES = Object.keys(EMBEDDED_ROUTES);

  function friendlyName(code){
    // strip trailing BUS used for rail-replacement bus shapes, keep raw letter for rail lines
    return code.replace(/BUS$/,'');
  }

  // ---------- Populate route dropdown ----------
  const select = document.getElementById('route-select');
  const badge = document.getElementById('badge');

  function sortRoutes(list){
    return list.slice().sort((a,b)=>{
      const an = parseInt(a,10), bn = parseInt(b,10);
      const aNum = !isNaN(an) && /^\d/.test(a);
      const bNum = !isNaN(bn) && /^\d/.test(b);
      if(aNum && bNum){ if(an!==bn) return an-bn; return a.localeCompare(b); }
      if(aNum && !bNum) return -1;
      if(!aNum && bNum) return 1;
      return a.localeCompare(b);
    });
  }

  function fillSelect(routes){
    select.innerHTML = '<option value="">Select a route…</option>';
    sortRoutes(routes).forEach(r=>{
      const opt = document.createElement('option');
      opt.value = r;
      opt.textContent = friendlyName(r);
      select.appendChild(opt);
    });
  }

  function loadRouteList(){
    // Show the full curated route list immediately and leave it alone from
    // here on. (Earlier versions re-populated this list in the background
    // after a live fetch resolved, which could rebuild the <select> options
    // out from under an in-progress tap/click and select the wrong line —
    // e.g. tapping "44" but landing on "43" because the list shifted. The
    // curated list below already covers every current Muni line, so there's
    // no need to mutate the dropdown again after this.)
    const baseList = Array.from(new Set([...EMBEDDED_ROUTE_NAMES, ...FALLBACK_ROUTES]));
    fillSelect(baseList);
  }

  // ---------- WKT / GeoJSON shape parsing ----------
  function parseWKTMultiLineString(wkt){
    // e.g. MULTILINESTRING ((-122.4 37.7, -122.5 37.8), (...))
    const lines = [];
    // Find every parenthesized coordinate group and parse it independently —
    // robust to any number of sub-lines in the MULTILINESTRING.
    const groupMatches = wkt.match(/\(([^()]+)\)/g);
    if(groupMatches){
      groupMatches.forEach(g=>{
        const coordStr = g.replace(/[()]/g,'');
        const pts = coordStr.split(',').map(pair=>{
          const [lon,lat] = pair.trim().split(/\s+/).map(Number);
          return [lat, lon];
        }).filter(p=>!isNaN(p[0]) && !isNaN(p[1]));
        if(pts.length>1) lines.push(pts);
      });
    }
    return lines;
  }

  function extractLinesFromShape(shape){
    if(!shape) return [];
    if(typeof shape === 'string'){
      return parseWKTMultiLineString(shape);
    }
    if(shape.type === 'MultiLineString' && Array.isArray(shape.coordinates)){
      return shape.coordinates.map(line=> line.map(([lon,lat])=>[lat,lon]) );
    }
    if(shape.type === 'LineString' && Array.isArray(shape.coordinates)){
      return [ shape.coordinates.map(([lon,lat])=>[lat,lon]) ];
    }
    return [];
  }

    progressModel = null;
    document.getElementById('info-card').classList.remove('visible');
    document.getElementById('empty-hint').classList.add('hidden');
    document.getElementById('progress-block').classList.remove('visible');
    document.getElementById('direction-toggle').innerHTML = '';

    if(!routeName){
      badge.textContent = 'SF'; badge.classList.add('empty');
      document.getElementById('empty-hint').classList.remove('hidden');
      return;
    }

    badge.textContent = friendlyName(routeName);
    badge.classList.remove('empty');

    // Prefer the embedded, always-available shapes for this route.
    if(EMBEDDED_ROUTES[routeName]){
      drawRouteFromShapes(routeName, EMBEDDED_ROUTES[routeName]);
      return;
    }

    // Otherwise, try the live SFMTA feed.
    try{
      const url = DATA_BASE + "?route_name=" + encodeURIComponent(routeName) + "&pattern_type=F&$limit=50";
      const res = await fetch(url);
      if(!res.ok) throw new Error('bad status '+res.status);
      const rows = await res.json();
      if(!rows.length) throw new Error('no shapes returned for this route');

      const seenDir = {};
      const shapes = {};
      rows.forEach(row=>{
        const dir = row.direction; // 'I' or 'O'
        if(seenDir[dir]) return; // keep first full pattern per direction to avoid overlapping dupes
        seenDir[dir] = true;
        shapes[dir] = row.shape;
      });

      drawRouteFromShapes(routeName, shapes);
    }catch(e){
      console.error(e);
      showError("Route " + friendlyName(routeName) + " isn't in the offline set and the live SFMTA feed couldn't be reached from here. Lines 1–14 always work offline; other lines need that live connection to succeed.");
    }
  }

  function drawRouteFromShapes(routeName, shapes){
    const bounds = [];

    Object.keys(shapes).forEach(dir=>{
      const lines = extractLinesFromShape(shapes[dir]);
      if(!lines.length) return;

      const color = dir === 'I' ? getComputedColor('--inbound') : getComputedColor('--outbound');
      const layers = [];

      lines.forEach(latlngs=>{
        if(latlngs.length < 2) return;
        const pl = L.polyline(latlngs, {
          color, weight:5, opacity:0.55, lineCap:'round', lineJoin:'round'
        }).addTo(routeLayerGroup);
        layers.push(pl);
        latlngs.forEach(p=>bounds.push(p));

        for(let i=0;i<latlngs.length-1;i++){
          routeSegments.push({a:latlngs[i], b:latlngs[i+1]});
        }

        const startPt = latlngs[0];
        const label = dir === 'I' ? 'Inbound start' : 'Outbound start';
        L.marker(startPt, {
          icon: L.divIcon({className:'', html:`<div class="end-marker">${label}</div>`, iconSize:null})
        }).addTo(routeLayerGroup);
      });

      currentRouteDirs[dir] = { lines, layers };
    });

    if(bounds.length){
      routeBounds = L.latLngBounds(bounds);
      map.fitBounds(routeBounds, {padding:[60,60]});
    }

    document.getElementById('info-title').textContent = 'Route ' + friendlyName(routeName);
    document.getElementById('info-card').classList.add('visible');

    setupDirectionToggle();
    updateDistanceReadout();
  }

  // ---------- Direction toggle ----------
  function setupDirectionToggle(){
    const wrap = document.getElementById('direction-toggle');
    wrap.innerHTML = '';
    const dirs = Object.keys(currentRouteDirs);

    if(!dirs.length){
      activeDirection = null;
      progressModel = null;
      document.getElementById('progress-block').classList.remove('visible');
      return;
    }

    activeDirection = currentRouteDirs['I'] ? 'I' : dirs[0];

    ['I','O'].forEach(d=>{
      const available = !!currentRouteDirs[d];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dir-btn ' + (d === 'I' ? 'inbound' : 'outbound');
      btn.innerHTML = '<span class="dot-swatch"></span>' + (d === 'I' ? 'Inbound' : 'Outbound');
      btn.disabled = !available;
      if(d === activeDirection) btn.classList.add('active');
      btn.addEventListener('click', ()=> setActiveDirection(d));
      wrap.appendChild(btn);
    });

    applyActiveDirectionStyling();
    buildProgressModel();
    document.getElementById('progress-block').classList.add('visible');
  }

  function setActiveDirection(d){
    if(!currentRouteDirs[d]) return;
    if(d === activeDirection) return;
    activeDirection = d;
    document.querySelectorAll('#direction-toggle .dir-btn').forEach(btn=>{
      const btnDir = btn.classList.contains('inbound') ? 'I' : 'O';
      btn.classList.toggle('active', btnDir === activeDirection);
    });
    applyActiveDirectionStyling();
    buildProgressModel();
    updateDistanceReadout();
  }

  function applyActiveDirectionStyling(){
    Object.keys(currentRouteDirs).forEach(d=>{
      const emphasize = d === activeDirection;
      currentRouteDirs[d].layers.forEach(pl=>{
        pl.setStyle({ opacity: emphasize ? 0.95 : 0.3, weight: emphasize ? 6 : 4 });
        if(emphasize) pl.bringToFront();
      });
    });
  }

  // ---------- Along-route progress model ----------
  function buildProgressModel(){
    progressModel = null;
    if(!activeDirection || !currentRouteDirs[activeDirection]) return;

    const points = [];
    currentRouteDirs[activeDirection].lines.forEach(l => points.push(...l));
    if(points.length < 2) return;

    const cumDist = [0];
    for(let i=1;i<points.length;i++){
      cumDist.push(cumDist[i-1] + haversine(points[i-1][0],points[i-1][1], points[i][0],points[i][1]));
    }
    progressModel = { points, cumDist, total: cumDist[cumDist.length-1] };
  }

  // Finds the point on the active-direction route nearest to `pos`, and how
  // far along that route (from its start) that point is.
  function computeProgress(pos){
    if(!progressModel || progressModel.points.length < 2) return null;
    const { points, cumDist, total } = progressModel;

    let bestPerp = Infinity, bestAlong = 0;
    const lat0 = pos[0]*Math.PI/180;
    const kx = Math.cos(lat0);

    for(let i=0;i<points.length-1;i++){
      const a = points[i], b = points[i+1];
      const Ax = (a[1]-pos[1])*kx, Ay = (a[0]-pos[0]);
      const Bx = (b[1]-pos[1])*kx, By = (b[0]-pos[0]);
      const ABx = Bx-Ax, ABy = By-Ay;
      const len2 = ABx*ABx + ABy*ABy;
      let t = len2 === 0 ? 0 : ((-Ax*ABx + -Ay*ABy) / len2);
      t = Math.max(0, Math.min(1, t));
      const nx = Ax + ABx*t, ny = Ay + ABy*t;
      const nLon = pos[1] + nx/kx, nLat = pos[0] + ny;
      const perp = haversine(pos[0], pos[1], nLat, nLon);
      if(perp < bestPerp){
        bestPerp = perp;
        const segLen = cumDist[i+1] - cumDist[i];
        bestAlong = cumDist[i] + t*segLen;
      }
    }

    return {
      perpMeters: bestPerp,
      alongMeters: bestAlong,
      totalMeters: total,
      pct: total > 0 ? (bestAlong/total)*100 : 0
    };
  }

  function getComputedColor(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  select.addEventListener('change', ()=> loadRoute(select.value));

  // ---------- Error toast ----------
  let errorTimer = null;
  function showError(msg){
    const el = document.getElementById('error-toast');
    el.textContent = msg;
    el.classList.add('visible');
    clearTimeout(errorTimer);
    errorTimer = setTimeout(()=> el.classList.remove('visible'), 6000);
  }

  // ---------- Geolocation ----------
  let meMarker = null;
  let watchId = null;
  let following = false;
  let lastPos = null;

  const locateBtn = document.getElementById('locate-btn');
  const gpsDot = document.getElementById('gps-dot');
  const gpsText = document.getElementById('gps-text');

  // ---------- Collapsible info card ----------
  const infoCard = document.getElementById('info-card');
  const collapseBtn = document.getElementById('collapse-btn');
  collapseBtn.addEventListener('click', ()=>{
    infoCard.classList.toggle('collapsed');
    updateInfoSummary();
  });

  function positionHeadsignOffsets(){
    const hs = document.getElementById('headsign');
    const h = hs.getBoundingClientRect().height;
    locateBtn.style.top = (h + 14) + 'px';
    document.getElementById('error-toast').style.top = (h + 14) + 'px';
    document.getElementById('empty-hint').style.top = (h + 14) + 'px';
  }
  window.addEventListener('resize', positionHeadsignOffsets);
  positionHeadsignOffsets();

  function onPosition(pos){
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    lastPos = [lat, lon];
    gpsDot.classList.add('live');
    gpsText.textContent = 'GPS live';

    if(!meMarker){
      meMarker = L.marker([lat,lon], {
        icon: L.divIcon({className:'', html:'<div class="me-dot"></div>', iconSize:[16,16]}),
        zIndexOffset: 1000
      }).addTo(map);
    }else{
      meMarker.setLatLng([lat,lon]);
    }

    if(following){
      map.panTo([lat,lon], {animate:true});
    }
    updateDistanceReadout();
  }

  function onPositionError(err){
    console.warn(err);
    gpsText.textContent = 'GPS unavailable';
    showError('Location access was blocked or unavailable. Enable location permissions to track your position.');
    following = false;
    locateBtn.classList.remove('following');
  }

  function startWatch(){
    if(!('geolocation' in navigator)){
      showError('This browser does not support geolocation.');
      return;
    }
    if(watchId !== null) return;
    gpsText.textContent = 'Locating…';
    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
      enableHighAccuracy:true, maximumAge:5000, timeout:15000
    });
  }

  locateBtn.addEventListener('click', ()=>{
    following = !following;
    locateBtn.classList.toggle('following', following);
    if(following){
      startWatch();
      if(lastPos) map.panTo(lastPos, {animate:true});
    }
  });

  // Start passively watching as soon as permission is available, without forcing a prompt loop.
  startWatch();

  // ---------- Distance-to-route calculation ----------
  function haversine(lat1,lon1,lat2,lon2){
    const R = 6371000;
    const toRad = d=> d*Math.PI/180;
    const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }

  function nearestPointOnSegment(p, a, b){
    // local equirectangular projection around p for meter-scale accuracy
    const lat0 = p[0]*Math.PI/180;
    const kx = Math.cos(lat0);
    const toXY = (pt)=> [ (pt[1]-p[1])*kx, (pt[0]-p[0]) ];
    const A = toXY(a), B = toXY(b);
    const AB = [B[0]-A[0], B[1]-A[1]];
    const len2 = AB[0]*AB[0]+AB[1]*AB[1];
    let t = len2 === 0 ? 0 : (( -A[0]*AB[0] + -A[1]*AB[1]) / len2);
    t = Math.max(0, Math.min(1, t));
    const nx = A[0] + AB[0]*t, ny = A[1] + AB[1]*t;
    const lon = p[1] + nx/kx, lat = p[0] + ny;
    return [lat, lon];
  }

  function updateDistanceReadout(){
    const valEl = document.getElementById('distance-value');
    const subEl = document.getElementById('distance-sub');
    const coordEl = document.getElementById('nearest-coord');

    if(!lastPos){
      valEl.textContent = '—';
      subEl.textContent = 'turn on GPS to measure';
      coordEl.textContent = '—';
      updateProgressReadout(null);
      updateInfoSummary();
      return;
    }
    if(!routeSegments.length){
      valEl.textContent = '—';
      subEl.textContent = 'pick a route to measure';
      coordEl.textContent = '—';
      updateProgressReadout(null);
      updateInfoSummary();
      return;
    }

    let best = Infinity, bestPt = null;
    for(let i=0;i<routeSegments.length;i++){
      const seg = routeSegments[i];
      const np = nearestPointOnSegment(lastPos, seg.a, seg.b);
      const d = haversine(lastPos[0], lastPos[1], np[0], np[1]);
      if(d < best){ best = d; bestPt = np; }
    }

    if(best < 1000){
      valEl.textContent = Math.round(best) + ' m';
    }else{
      valEl.textContent = (best/1000).toFixed(1) + ' km';
    }
    subEl.textContent = best < 40 ? "you're on the line" : 'to the nearest point on the route';
    coordEl.textContent = bestPt[0].toFixed(4) + ', ' + bestPt[1].toFixed(4);

    updateProgressReadout(lastPos);
    updateInfoSummary();
  }

  // Condensed one-line readout shown next to the title when the panel is collapsed.
  function updateInfoSummary(){
    const el = document.getElementById('info-summary');
    const parts = [];
    const pct = document.getElementById('progress-pct').textContent;
    const dist = document.getElementById('distance-value').textContent;
    if(pct && pct !== '—') parts.push(pct + ' along');
    if(dist && dist !== '—') parts.push(dist + ' off-route');
    el.textContent = parts.join(' · ');
  }

  function updateProgressReadout(pos){
    const block = document.getElementById('progress-block');
    const milesEl = document.getElementById('progress-miles');
    const pctEl = document.getElementById('progress-pct');
    const fillEl = document.getElementById('progress-fill');
    const heading = block.querySelector('.stat-label');

    if(!activeDirection || !progressModel){
      block.classList.remove('visible');
      return;
    }
    block.classList.add('visible');
    heading.textContent = 'Progress along route (' + (activeDirection === 'I' ? 'Inbound' : 'Outbound') + ')';

    if(!pos){
      milesEl.textContent = '—';
      pctEl.textContent = '—';
      fillEl.style.width = '0%';
      return;
    }

    const p = computeProgress(pos);
    if(!p){
      milesEl.textContent = '—';
      pctEl.textContent = '—';
      fillEl.style.width = '0%';
      return;
    }

    const miles = p.alongMeters / 1609.344;
    const pct = Math.max(0, Math.min(100, p.pct));
    milesEl.textContent = miles.toFixed(1);
    pctEl.textContent = pct.toFixed(1) + '%';
    fillEl.style.width = pct.toFixed(1) + '%';
  }

  // periodically refresh readout even without new GPS fixes (e.g. after switching routes)
  setInterval(updateDistanceReadout, 4000);

  // ---------- init ----------
  loadRouteList();
})();
</script>
</body>
</html>
