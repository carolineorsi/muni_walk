<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Muni Walker — Follow the Line</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="headsign">
    <div id="badge" class="badge empty">SF</div>
    <div id="picker-wrap">
      <p id="route-label">Choose a Muni line</p>
      <select id="route-select">
        <option value="">Loading routes…</option>
      </select>
    </div>
    <div id="status-pill"><span class="dot" id="gps-dot"></span><span id="gps-text">GPS off</span></div>
  </div>

  <div id="empty-hint">Pick a line above to draw its route. Tap the compass to track your position and follow it on foot.</div>
  <div id="error-toast"></div>

  <select id="basemap-select" title="Map style" aria-label="Map style">
    <option value="dark">Dark</option>
    <option value="light" selected>Light</option>
    <option value="streets">Streets</option>
    <option value="satellite">Satellite</option>
  </select>

  <button id="locate-btn" title="Follow my location" aria-label="Follow my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
    </svg>
  </button>

  <div id="info-card">
    <div class="info-row">
      <div class="info-title" id="info-title">—</div>
      <span id="info-summary"></span>
      <button id="collapse-btn" title="Collapse panel" aria-label="Collapse panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"></path>
        </svg>
      </button>
    </div>

    <div id="info-card-body">
    <div id="direction-toggle"></div>

    <div id="live-block">
      <div class="live-heading">
        <span class="stat-label">Live buses</span>
        <div id="live-toggle" title="Toggle live buses"><div class="knob"></div></div>
      </div>

      <div id="live-status"></div>

      <div id="live-arrival">
        <span class="stat-label" id="live-arrival-label">Next arrival</span>
        <div class="live-arrival-main">
          <span id="live-arrival-mins">—</span>
          <span id="live-arrival-unit">min</span>
        </div>
        <div id="live-arrival-stop">—</div>
      </div>

      <div id="live-list"></div>
    </div>

    <div id="progress-block">
      <div class="progress-heading">
        <span class="stat-label">Progress along route</span>
        <span id="progress-pct">—</span>
      </div>
      <div class="progress-figures">
        <span id="progress-miles">—</span><span id="progress-miles-unit">mi walked of route</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div id="progress-sub">— mi total · — mi remaining</div>
    </div>

    <div id="distance-block">
      <div>
        <span class="stat-label">Distance to route</span>
        <div id="distance-value">—</div>
        <div id="distance-sub">turn on GPS to measure</div>
      </div>
      <div style="text-align:right">
        <span class="stat-label">Nearest point</span>
        <div class="stat" id="nearest-coord">—</div>
      </div>
    </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/routes-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
