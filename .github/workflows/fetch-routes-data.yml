name: Fetch routes data (one-off)

# Temporary, manually-triggered workflow, present on main only so
# workflow_dispatch can invoke it (GitHub requires that). It doesn't touch
# main's own content — it checks out the target feature branch, regenerates
# js/routes-data.js there from SFMTA's public route-shapes dataset, and
# pushes the result back to that branch. Delete this file (and
# scripts/fetch-routes-data.mjs, if no longer wanted) once the hard-coded
# route data is in place.
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to regenerate js/routes-data.js on and push to"
        required: true
        default: "claude/muni-routes-hardcode-ne0wd4"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate js/routes-data.js
        run: node scripts/fetch-routes-data.mjs > js/routes-data.js.new && mv js/routes-data.js.new js/routes-data.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/routes-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Regenerate js/routes-data.js from SFMTA route-shapes dataset"
          git push origin HEAD:${{ github.event.inputs.target_branch }}
