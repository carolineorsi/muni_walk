name: Fetch routes data (one-off)

# Temporary, manually-triggered workflow: regenerates js/routes-data.js from
# SFMTA's public route-shapes dataset and commits it to whichever branch this
# is run on. Not wired to any automatic trigger. Safe to delete once the
# hard-coded route data is in place — see scripts/fetch-routes-data.mjs to
# regenerate it again by hand in the future.
on:
  workflow_dispatch: {}
  # workflow_dispatch alone won't let the API trigger this until the file
  # exists on the default branch, so also fire on push to this feature
  # branch. The commit this job pushes back includes [skip ci] so it doesn't
  # loop.
  push:
    branches: [claude/muni-routes-hardcode-ne0wd4]
    paths:
      - ".github/workflows/fetch-routes-data.yml"
      - "scripts/fetch-routes-data.mjs"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate js/routes-data.js
        run: node scripts/fetch-routes-data.mjs > js/routes-data.js.new && mv js/routes-data.js.new js/routes-data.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/routes-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Regenerate js/routes-data.js from SFMTA route-shapes dataset [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
